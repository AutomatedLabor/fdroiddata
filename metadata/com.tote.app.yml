      echo "Building unsigned release APK for F-Droid signing"

MaintainerNotes: |
  Tote is a multi-profile browser with E2E-encrypted session transfer.
  Releases are tagged on GitHub Releases with .sha256 sidecar. The upstream
  release keystore (cert SHA-256 df96cae5...) is NOT used for F-Droid builds —
  F-Droid signs with its own keystore.

  All dependencies are FLOSS-compatible:
    - lazysodium-java (ISC) — JNA wrapper around libsodium
    - jna (Apache-2.0 / LGPL-2.1) — Java Native Access
    - CameraX (Apache-2.0) — AndroidX camera library
    - ZXing (Apache-2.0) — QR code generation/detection
    - OkHttp (Apache-2.0) — HTTP client
    - kotlinx-serialization (Apache-2.0) — JSON/CBOR serialization
    - kotlinx-coroutines (Apache-2.0) — coroutine support
    - com.google.android.material (Apache-2.0) — Material Components
    - androidx.* (Apache-2.0) — AndroidX libraries

  Note: jna is LGPL-2.1 — F-Droid accepts LGPL but the user must be able to
  replace the JNA native libraries. Tote ships the lazysodium-android .so
  files per-ABI inside the APK (via the lazysodium-android artifact), which
  satisfies the LGPL "user-replaceable" requirement since APKs are
  user-installable.

  The relay (https://github.com/AutomatedLabor/tote-relay) is a separate Go
  binary that can be self-hosted. The default relay URL (relay.tote.app) is
  NOT hardcoded — users can change it in Settings (TODO at v1.0.0 ship).
  For the alpha, the relay URL is hardcoded in ToteApplication.kt + the
  pairing QR payload. Self-hosted relays require building from source with
  a custom default URL.

