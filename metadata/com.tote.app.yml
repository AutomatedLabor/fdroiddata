AutoName: Tote

Summary: Multi-profile browser with E2E-encrypted session transfer

Description: |
  Tote is a multi-profile Android browser that lets you transfer logged-in
  web sessions between your own devices, end-to-end encrypted.

  WhatsApp Linked Devices, but for web sessions, on mobile.

  You log into a grocery web app on Phone A. 5 minutes later (or 5 weeks later)
  you want that same logged-in session on Phone B. Tote transfers the session —
  cookies and all — via an E2E-encrypted relay. No Playwright. No Chromium fork.
  Just a WebView-based mobile app that owns its cookie jar.

  There is no vendor account. There is no cloud copy of your sessions. The relay
  cannot read your data.

  Features:
    * Multi-profile browsing (no shared cookies between profiles)
    * Pair devices via QR + 6-digit/3-emoji SAS verification
    * Send a logged-in session to a paired device (encrypted in transit)
    * Foreground sync service applies incoming sessions automatically
    * Truly-live tabs (WebView pool with saveState/restoreState — no reload on tab switch)
    * Recovery code (12-word BIP-39 mnemonic, Argon2id-derived master key)
    * Kill switch (NUKE 24h cooldown + DURESS immediate wipe)
    * Material 3 theme + Material You dynamic color
    * Adaptive launcher icon
    * No analytics. No telemetry. No accounts.

  Crypto: Ed25519 (signing), X25519 (ECDH), XChaCha20-Poly1305-IETF (AEAD),
  Argon2id (memory-hard KDF), HKDF-SHA256 (key derivation), AndroidKeyStore
  AES-256-GCM master key (hardware-backed on TEE/StrongBox, biometric-protected
  since v1.1.0).

  Anti-fraud bright line (non-negotiable): Tote does NOT forge TLS/JA3/JA4/canvas
  fingerprints. We move your own sessions across your own devices; we do not
  defeat site security.

  Source code: https://github.com/AutomatedLabor/tote
  Relay source: https://github.com/AutomatedLabor/tote-relay

